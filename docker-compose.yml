services:
  bbc-news:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bbc-news-app
    ports:
      - "8000:8000"
    devices:
      - /dev/snd:/dev/snd
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant
    volumes:
      - homeassistant_config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    ports:
      - "8123:8123"
    restart: unless-stopped
    privileged: true

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: home-assistant-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - homeassistant
    restart: unless-stopped

  matter-server:
    image: ghcr.io/matter-js/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    ports:
      - "5580:5580"
    volumes:
      - matter_server_data:/data
    security_opt:
      - seccomp:unconfined
    # Uncomment and adjust this line if you are using a Thread/Matter radio via USB serial.
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0

  otbr:
    image: openthread/border-router:latest
    container_name: otbr
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # IPv6 sysctl changes on host networking are not allowed in Docker's host namespace.
    # Set net.ipv6.conf.all.disable_ipv6 on the host/VM instead of inside the container.
    environment:
      OTBR_WEB: "false"
      OTBR_WEB_PORT: "8081"
      OTBR_BACKBONE_ROUTER: "false"
      OTBR_MDNS: "0"
    volumes:
      - otbr_data:/var/lib/otbr
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    ports:
      - "8081:8081"
    # If your Thread radio is on a different USB path, adjust the line above.
    # Port 8080 is already commonly used by another process in host networking mode.

volumes:
  homeassistant_config:
  matter_server_data:
  otbr_data:
