services:
  bbc-news:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bbc-news-app
    ports:
      - "8000:8000"
    devices:
      - /dev/snd:/dev/snd
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant
    network_mode: host
    volumes:
      - homeassistant_config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    ports:
      - "8123:8123"
    restart: unless-stopped
    privileged: true

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: home-assistant-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - homeassistant
    restart: unless-stopped

  matter-server:
    image: ghcr.io/matter-js/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    ports:
      - "5580:5580"
    volumes:
      - matter_server_data:/data
    security_opt:
      - seccomp:unconfined
    # Uncomment and adjust this line if you are using a Thread/Matter radio via USB serial.
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0

  otbr:
    image: openthread/otbr:latest
    container_name: otbr
    restart: unless-stopped
    network_mode: host
    privileged: true
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

    environment:
      OT_INFRA_IF: wlp1s0
      OT_THREAD_IF: wpan0

    command:
      - --radio-url
      - spinel+hdlc+uart:///dev/ttyUSB0?uart-baudrate=460800
      - --backbone-interface
      - wlp1s0

  music-assistant:
    image: ghcr.io/music-assistant/server:stable
    container_name: music-assistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - music_assistant_data:/data
      - /home/andrew/music:/media/music:ro
    # Uncomment for local ALSA audio output on the host.
    # devices:
    #   - /dev/snd:/dev/snd
  sendspin-client:
    image: ghcr.io/trudenboy/sendspin-bt-bridge:latest
    container_name: sendspin-client
    restart: unless-stopped
    network_mode: host

    volumes:
      - /var/run/dbus:/var/run/dbus
      - /run/user/1000/pulse:/run/user/1000/pulse
      - /run/user/1000/pipewire-0:/run/user/1000/pipewire-0
      - /etc/docker/Sendspin:/config

    environment:
      SENDSPIN_SERVER: auto
      WEB_PORT: 8080
      CONFIG_DIR: /config
      AUDIO_UID: 1000
      AUDIO_GID: 1000
      PULSE_SERVER: unix:/run/user/1000/pulse/native
      XDG_RUNTIME_DIR: /run/user/1000

    devices:
      - /dev/bus/usb:/dev/bus/usb

    cap_add:
      - NET_ADMIN
      - NET_RAW

    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined

volumes:
  homeassistant_config:
  matter_server_data:
  otbr_data:
  music_assistant_data:
