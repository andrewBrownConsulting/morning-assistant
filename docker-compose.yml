services:
  bbc-news:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bbc-news-app
    ports:
      - "8000:8000"
    devices:
      - /dev/snd:/dev/snd
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant
    volumes:
      - homeassistant_config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    ports:
      - "8123:8123"
    restart: unless-stopped
    privileged: true

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: home-assistant-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - homeassistant
    restart: unless-stopped

  matter-server:
    image: ghcr.io/matter-js/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    ports:
      - "5580:5580"
    volumes:
      - matter_server_data:/data
    security_opt:
      - seccomp:unconfined
    # Uncomment and adjust this line if you are using a Thread/Matter radio via USB serial.
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0

  otbr:
    image: openthread/border-router:latest
    container_name: otbr
    restart: unless-stopped
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - OT_RCP_DEVICE=spinel+hdlc+uart:///dev/ttyACM0?uart-baudrate=460800
      - OT_INFRA_IF=wlp1s0
      - OT_THREAD_IF=wpan0
      - OT_LOG_LEVEL=7
    volumes:
      - otbr_data:/var/lib/otbr
    devices:
      - /dev/ttyUSB0:/dev/ttyACM0
      - /dev/net/tun:/dev/net/tun
volumes:
  homeassistant_config:
  matter_server_data:
  otbr_data:
